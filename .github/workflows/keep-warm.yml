# Render's free tier spins a service down after ~15 minutes idle and takes
# 30-60s to wake — which is exactly what a first-time visitor would hit.
# Set the repository variable KEEP_WARM_URL to the API's base URL to enable.
name: Keep the API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        env:
          URL: ${{ vars.KEEP_WARM_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "KEEP_WARM_URL is not set; nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 "$URL" > /dev/null
          echo "Pinged $URL"
