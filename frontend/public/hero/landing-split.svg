<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Landing page mockup with a split layout: copy on the left, product shot on the right">
  <defs>
    <linearGradient id="shot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="320" height="240" fill="#ffffff"/>

  <!-- nav -->
  <rect width="320" height="30" fill="#ffffff"/>
  <rect y="29" width="320" height="1" fill="#e6e6ea"/>
  <circle cx="22" cy="15" r="6" fill="#6366f1"/>
  <rect x="34" y="12" width="30" height="6" rx="3" fill="#1c1c22"/>
  <rect x="212" y="12" width="24" height="6" rx="3" fill="#a5a5ae"/>
  <rect x="244" y="12" width="24" height="6" rx="3" fill="#a5a5ae"/>
  <rect x="278" y="8" width="24" height="14" rx="7" fill="#1c1c22"/>

  <!-- left copy -->
  <rect x="20" y="66" width="76" height="12" rx="6" fill="#f1f0ff" stroke="#d6d2ff" stroke-width="1.5"/>
  <rect x="30" y="69" width="56" height="6" rx="3" fill="#6366f1"/>

  <rect x="20" y="94" width="130" height="15" rx="4" fill="#15151a"/>
  <rect x="20" y="116" width="104" height="15" rx="4" fill="#15151a"/>

  <rect x="20" y="146" width="128" height="7" rx="3.5" fill="#9d9da8"/>
  <rect x="20" y="159" width="100" height="7" rx="3.5" fill="#9d9da8"/>

  <rect x="20" y="182" width="76" height="26" rx="6" fill="#15151a"/>
  <rect x="38" y="192" width="40" height="6" rx="3" fill="#ffffff"/>
  <rect x="104" y="192" width="44" height="6" rx="3" fill="#6366f1"/>

  <!-- right product shot -->
  <rect x="176" y="54" width="128" height="156" rx="10" fill="url(#shot)"/>
  <rect x="190" y="70" width="100" height="60" rx="6" fill="#ffffff" opacity="0.92"/>
  <rect x="200" y="82" width="52" height="7" rx="3.5" fill="#3f3f52"/>
  <rect x="200" y="95" width="76" height="5" rx="2.5" fill="#b6b6c4"/>
  <rect x="200" y="105" width="64" height="5" rx="2.5" fill="#b6b6c4"/>
  <rect x="200" y="116" width="34" height="8" rx="4" fill="#6366f1"/>
  <rect x="190" y="142" width="100" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
  <rect x="190" y="160" width="70" height="10" rx="5" fill="#ffffff" opacity="0.35"/>
  <rect x="190" y="178" width="86" height="10" rx="5" fill="#ffffff" opacity="0.25"/>
